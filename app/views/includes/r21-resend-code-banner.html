<!-- Messages for "request a new code" (R21 code pages). The mount is empty until
     the button is pressed, then /js/resend-code.js copies in the success banner
     (new code sent) or an error summary (pressed too soon, or locked out with
     ?resend=lockout) and focuses it. The too soon wait is filled in with the
     seconds left at the time of the press. Lockout items go to their
     link in the expander; pages without a "try a different sign-in method"
     link drop that item.
     Copy from content design (Oct 2026). Pages set resendCodeSuccess before the
     include, wording matched to the method (email or mobile phone). -->
<div data-resend-code-mount></div>
<template id="resend-code-banner">
  <div class="nhsuk-notification-banner nhsuk-notification-banner--success" role="alert"
    aria-labelledby="nhsuk-notification-banner-title" data-module="nhsuk-notification-banner">
    <div class="nhsuk-notification-banner__header">
      <h2 class="nhsuk-notification-banner__title" id="nhsuk-notification-banner-title">Success</h2>
    </div>
    <div class="nhsuk-notification-banner__content">
      <p class="nhsuk-notification-banner__heading">{{ resendCodeSuccess or "[Message saying a new code has been sent]" }}</p>
    </div>
  </div>
</template>
<template id="resend-code-error">
  <div class="nhsuk-error-summary" aria-labelledby="error-summary-title" role="alert">
    <h2 class="nhsuk-error-summary__title" id="error-summary-title">There is a problem</h2>
    <div class="nhsuk-error-summary__body">
      <ul class="nhsuk-list nhsuk-error-summary__list" role="list">
        <li><a href="#request-new-code">You must wait <span data-resend-code-wait>60 seconds</span> before requesting a new code</a></li>
      </ul>
    </div>
  </div>
</template>
<template id="resend-code-lockout">
  <div class="nhsuk-error-summary" aria-labelledby="error-summary-title" role="alert">
    <h2 class="nhsuk-error-summary__title" id="error-summary-title">There is a problem</h2>
    <div class="nhsuk-error-summary__body">
      <p>You have requested too many codes. You can:</p>
      <ul class="nhsuk-list nhsuk-error-summary__list" role="list">
        <li><a href="#request-new-code">Request a new code in 15 minutes</a></li>
        <li><a href="#try-another-method">Log in and try a different sign-in method</a></li>
      </ul>
    </div>
  </div>
</template>
