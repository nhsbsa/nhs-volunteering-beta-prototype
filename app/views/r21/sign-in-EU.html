<!-- Extends the layout from /views/layout.html -->
{% extends 'layout_vol_header_recruiter.html' %}

<!-- Set the page title inside the pageTitle block -->
{% block pageTitle %}
Sign in to NHS Volunteering
{% endblock %}




{% block content %}
<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-two-thirds">
    <h1 class="nhsuk-heading-l">Sign in to NHS Volunteering</h1>

    <form action="/r21/set-up-auth-EU" method="post">

      <div class="nhsuk-form-group">
        <label class="nhsuk-label" for="email">Enter your email address</label>
        <input class="nhsuk-input" id="email" name="email" type="email" spellcheck="false" autocomplete="email">
      </div>

      <div class="nhsuk-form-group">
        <label class="nhsuk-label" for="password">Enter your password</label>
        <input class="nhsuk-input" id="password" name="password" type="password" autocomplete="current-password">
      </div>

      <p><a href="/r21/forgot-password-email-EU" class="nhsuk-link">Forgotten your password?</a></p>

      <button class="nhsuk-button" data-module="nhsuk-button" type="submit">
        Continue
      </button>
    </form>

  </div>
</div>

{% endblock %}
